<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reitz Browser - Your futuristic web experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #FFE66D 0%, #FF6B6B 100%);
            --secondary-gradient: linear-gradient(135deg, #FFF4A3 0%, #FF8E8E 100%);
            --dark-bg: #1a1a2e;
            --darker-bg: #0f0f1e;
            --text-light: #ffffff;
            --text-dark: #333333;
            --shadow-glow: 0 0 20px rgba(255, 230, 109, 0.3);
            --shadow-hover: 0 0 30px rgba(255, 107, 107, 0.5);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--darker-bg);
            color: var(--text-light);
            overflow: hidden;
            height: 100vh;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(45deg, #1a1a2e, #16213e, #0f3460);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating particles */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, #FFE66D, #FF6B6B);
            border-radius: 50%;
            pointer-events: none;
            animation: float 20s infinite;
            opacity: 0.6;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-100px) translateX(50px); }
            50% { transform: translateY(-200px) translateX(-50px); }
            75% { transform: translateY(-100px) translateX(100px); }
        }

        /* Main Container */
        .browser-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 10px;
            gap: 10px;
        }

        /* Top Bar - Window Controls */
        .window-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 15px 15px 0 0;
            border: 1px solid rgba(255, 230, 109, 0.2);
        }

        .window-title {
            font-weight: 600;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 14px;
            letter-spacing: 2px;
        }

        .window-buttons {
            display: flex;
            gap: 8px;
        }

        .window-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .window-btn.close { background: #FF6B6B; }
        .window-btn.minimize { background: #FFE66D; }
        .window-btn.maximize { background: #4ECDC4; }

        .window-btn:hover {
            transform: scale(1.2);
            box-shadow: 0 0 10px currentColor;
        }

        /* Navigation Bar */
        .nav-bar {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 230, 109, 0.2);
            box-shadow: var(--shadow-glow);
        }

        .nav-controls {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 10px;
            background: var(--primary-gradient);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .nav-btn:hover::before {
            width: 100px;
            height: 100px;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .nav-btn:active {
            transform: translateY(0);
        }

        /* Address Bar */
        .address-bar-container {
            flex: 1;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .address-bar {
            flex: 1;
            display: flex;
            align-items: center;
            background: rgba(15, 15, 30, 0.8);
            border-radius: 12px;
            padding: 0 15px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .address-bar::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: var(--primary-gradient);
            border-radius: 12px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .address-bar:focus-within::before {
            opacity: 1;
        }

        .address-bar:focus-within {
            border-color: transparent;
        }

        .security-icon {
            font-size: 16px;
            margin-right: 10px;
            color: #4ECDC4;
        }

        .url-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-light);
            font-size: 14px;
            padding: 12px 0;
        }

        .url-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-btn {
            background: var(--primary-gradient);
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-hover);
        }

        /* Tabs Container */
        .tabs-container {
            display: flex;
            gap: 5px;
            padding: 10px 15px;
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 230, 109, 0.2);
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: #FFE66D var(--dark-bg);
        }

        .tabs-container::-webkit-scrollbar {
            height: 6px;
        }

        .tabs-container::-webkit-scrollbar-track {
            background: var(--dark-bg);
            border-radius: 10px;
        }

        .tabs-container::-webkit-scrollbar-thumb {
            background: var(--primary-gradient);
            border-radius: 10px;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: rgba(15, 15, 30, 0.6);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 200px;
            border: 1px solid transparent;
        }

        .tab.active {
            background: var(--primary-gradient);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: var(--shadow-glow);
        }

        .tab:hover:not(.active) {
            background: rgba(255, 230, 109, 0.1);
            border-color: rgba(255, 230, 109, 0.3);
        }

        .tab-icon {
            font-size: 16px;
        }

        .tab-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 13px;
        }

        .tab-close {
            background: rgba(255, 107, 107, 0.3);
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .tab-close:hover {
            background: #FF6B6B;
            transform: rotate(90deg);
        }

        .new-tab-btn {
            padding: 10px 15px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
            min-width: 40px;
        }

        .new-tab-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-hover);
        }

        /* Content Area */
        .content-area {
            flex: 1;
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 230, 109, 0.2);
            overflow: hidden;
            position: relative;
        }

        .browser-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        /* Home Page */
        .home-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px;
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.9), rgba(15, 15, 30, 0.9));
        }

        .home-logo {
            font-size: 72px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .home-search {
            width: 100%;
            max-width: 600px;
            margin-bottom: 40px;
        }

        .home-search-input {
            width: 100%;
            padding: 20px 25px;
            background: rgba(15, 15, 30, 0.8);
            border: 2px solid rgba(255, 230, 109, 0.3);
            border-radius: 50px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .home-search-input:focus {
            border-color: #FFE66D;
            box-shadow: var(--shadow-glow);
        }

        .quick-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        .quick-link {
            padding: 25px;
            background: rgba(15, 15, 30, 0.6);
            border: 1px solid rgba(255, 230, 109, 0.2);
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
        }

        .quick-link:hover {
            background: var(--primary-gradient);
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .quick-link-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .quick-link-title {
            font-size: 14px;
            font-weight: 600;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            right: -350px;
            top: 0;
            width: 350px;
            height: 100vh;
            background: rgba(26, 26, 46, 0.98);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 230, 109, 0.2);
            transition: right 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 230, 109, 0.2);
        }

        .sidebar-title {
            font-size: 24px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar-close {
            background: rgba(255, 107, 107, 0.3);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .sidebar-close:hover {
            background: #FF6B6B;
            transform: rotate(90deg);
        }

        .sidebar-section {
            margin-bottom: 25px;
        }

        .sidebar-section-title {
            font-size: 16px;
            font-weight: 600;
            color: #FFE66D;
            margin-bottom: 15px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(15, 15, 30, 0.6);
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sidebar-item:hover {
            background: var(--primary-gradient);
            transform: translateX(-5px);
        }

        /* Loading Bar */
        .loading-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 3px;
            background: var(--primary-gradient);
            width: 0%;
            transition: width 0.3s ease;
            z-index: 10;
        }

        .loading-bar.active {
            animation: loading 2s ease-in-out infinite;
        }

        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        /* Search Results */
        .search-results {
            padding: 30px;
            max-width: 800px;
            margin: 0 auto;
        }

        .search-result {
            background: rgba(15, 15, 30, 0.6);
            border: 1px solid rgba(255, 230, 109, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-result:hover {
            background: rgba(255, 230, 109, 0.1);
            border-color: #FFE66D;
            transform: translateX(5px);
        }

        .result-title {
            font-size: 18px;
            font-weight: 600;
            color: #FFE66D;
            margin-bottom: 8px;
        }

        .result-url {
            font-size: 12px;
            color: #4ECDC4;
            margin-bottom: 8px;
        }

        .result-snippet {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }

        /* Settings Panel */
        .settings-panel {
            padding: 20px;
        }

        .setting-group {
            margin-bottom: 25px;
        }

        .setting-label {
            display: block;
            margin-bottom: 10px;
            color: #FFE66D;
            font-weight: 600;
        }

        .setting-input {
            width: 100%;
            padding: 12px;
            background: rgba(15, 15, 30, 0.8);
            border: 1px solid rgba(255, 230, 109, 0.3);
            border-radius: 8px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }

        .setting-input:focus {
            border-color: #FFE66D;
            box-shadow: var(--shadow-glow);
        }

        .toggle-switch {
            position: relative;
            width: 60px;
            height: 30px;
            background: rgba(15, 15, 30, 0.8);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-switch.active {
            background: var(--primary-gradient);
        }

        .toggle-slider {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .toggle-switch.active .toggle-slider {
            left: 33px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-controls {
                flex-wrap: wrap;
            }

            .quick-links {
                grid-template-columns: repeat(2, 1fr);
            }

            .sidebar {
                width: 100%;
                right: -100%;
            }
        }

        /* Utility Classes */
        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 0 0 15px 15px;
            border: 1px solid rgba(255, 230, 109, 0.2);
            font-size: 12px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ECDC4;
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg"></div>

    <!-- Floating Particles -->
    <script>
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            document.body.appendChild(particle);
        }
    </script>

    <!-- Main Browser Container -->
    <div class="browser-container">
        <!-- Window Controls -->
        <div class="window-controls">
            <div class="window-title">REITZ BROWSER</div>
            <div class="window-buttons">
                <button class="window-btn minimize" onclick="alert('Minimize')"></button>
                <button class="window-btn maximize" onclick="alert('Maximize')"></button>
                <button class="window-btn close" onclick="alert('Close')"></button>
            </div>
        </div>

        <!-- Navigation Bar -->
        <div class="nav-bar">
            <div class="nav-controls">
                <button class="nav-btn" onclick="goBack()" title="Back">◀</button>
                <button class="nav-btn" onclick="goForward()" title="Forward">▶</button>
                <button class="nav-btn" onclick="refresh()" title="Refresh">↻</button>
                <button class="nav-btn" onclick="goHome()" title="Home">⌂</button>
            </div>

            <div class="address-bar-container">
                <div class="address-bar">
                    <span class="security-icon" id="securityIcon">🔒</span>
                    <input type="text" class="url-input" id="urlInput" placeholder="Search or enter website URL..." onkeypress="handleEnter(event)">
                    <button class="search-btn" onclick="performSearch()">Search</button>
                </div>
            </div>

            <div class="nav-controls">
                <button class="nav-btn" onclick="toggleBookmarks()" title="Bookmarks">★</button>
                <button class="nav-btn" onclick="toggleHistory()" title="History">⏱</button>
                <button class="nav-btn" onclick="toggleDownloads()" title="Downloads">⬇</button>
                <button class="nav-btn" onclick="toggleSettings()" title="Settings">⚙</button>
            </div>
        </div>

        <!-- Tabs Container -->
        <div class="tabs-container" id="tabsContainer">
            <div class="tab active" data-tab-id="1">
                <span class="tab-icon">🏠</span>
                <span class="tab-title">New Tab</span>
                <button class="tab-close" onclick="closeTab(event, 1)">×</button>
            </div>
            <button class="new-tab-btn" onclick="createNewTab()">+</button>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            <div class="loading-bar" id="loadingBar"></div>
            
            <!-- Home Page -->
            <div class="home-page" id="homePage">
                <div class="home-logo">REITZ</div>
                <div class="home-search">
                    <input type="text" class="home-search-input" id="homeSearchInput" placeholder="Search the web..." onkeypress="handleHomeSearch(event)">
                </div>
                <div class="quick-links">
                    <div class="quick-link" onclick="quickNavigate('https://www.google.com')">
                        <div class="quick-link-icon">🔍</div>
                        <div class="quick-link-title">Google</div>
                    </div>
                    <div class="quick-link" onclick="quickNavigate('https://www.youtube.com')">
                        <div class="quick-link-icon">📺</div>
                        <div class="quick-link-title">YouTube</div>
                    </div>
                    <div class="quick-link" onclick="quickNavigate('https://www.github.com')">
                        <div class="quick-link-icon">💻</div>
                        <div class="quick-link-title">GitHub</div>
                    </div>
                    <div class="quick-link" onclick="quickNavigate('https://www.twitter.com')">
                        <div class="quick-link-icon">🐦</div>
                        <div class="quick-link-title">Twitter</div>
                    </div>
                </div>
            </div>

            <!-- Browser Frame (Hidden by default) -->
            <iframe class="browser-frame hidden" id="browserFrame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>

            <!-- Search Results Container -->
            <div class="search-results hidden" id="searchResults"></div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <span class="status-indicator"></span>
                <span id="statusText">Ready</span>
            </div>
            <div class="status-item">
                <span id="pageInfo">Reitz Browser v1.0</span>
            </div>
            <div class="status-item">
                <span id="connectionStatus">🌐 Online</span>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title" id="sidebarTitle">Menu</div>
            <button class="sidebar-close" onclick="closeSidebar()">×</button>
        </div>
        <div id="sidebarContent"></div>
    </div>

    <script>
        // Browser State
        let currentTabId = 1;
        let tabCounter = 1;
        let tabs = {
            1: { url: '', title: 'New Tab', history: [], historyIndex: -1 }
        };
        let bookmarks = JSON.parse(localStorage.getItem('reitz_bookmarks')) || [];
        let history = JSON.parse(localStorage.getItem('reitz_history')) || [];
        let settings = JSON.parse(localStorage.getItem('reitz_settings')) || {
            searchEngine: 'google',
            homepage: 'about:home',
            apiKey: '',
            searchEngineId: ''
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadSettings();
            updateStatus('Browser initialized');
        });

        // Navigation Functions
        function goBack() {
            const tab = tabs[currentTabId];
            if (tab.historyIndex > 0) {
                tab.historyIndex--;
                loadUrl(tab.history[tab.historyIndex], false);
            }
        }

        function goForward() {
            const tab = tabs[currentTabId];
            if (tab.historyIndex < tab.history.length - 1) {
                tab.historyIndex++;
                loadUrl(tab.history[tab.historyIndex], false);
            }
        }

        function refresh() {
            const tab = tabs[currentTabId];
            if (tab.url) {
                loadUrl(tab.url, false);
            } else {
                location.reload();
            }
        }

        function goHome() {
            showHomePage();
        }

        // URL and Search Handling
        function handleEnter(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        }

        function handleHomeSearch(event) {
            if (event.key === 'Enter') {
                const query = document.getElementById('homeSearchInput').value;
                document.getElementById('urlInput').value = query;
                performSearch();
            }
        }

        function performSearch() {
            const input = document.getElementById('urlInput').value.trim();
            
            if (!input) return;

            // Check if it's a URL
            if (isValidUrl(input)) {
                loadUrl(input);
            } else {
                // Perform search
                searchWeb(input);
            }
        }

        function isValidUrl(string) {
            try {
                const url = new URL(string.startsWith('http') ? string : 'https://' + string);
                return true;
            } catch (_) {
                return false;
            }
        }

        function loadUrl(url, addToHistory = true) {
            if (!url.startsWith('http')) {
                url = 'https://' + url;
            }

            const tab = tabs[currentTabId];
            tab.url = url;

            if (addToHistory) {
                tab.history = tab.history.slice(0, tab.historyIndex + 1);
                tab.history.push(url);
                tab.historyIndex++;
            }

            // Add to global history
            addToGlobalHistory(url);

            // Show loading
            showLoading();

            // Hide home page
            document.getElementById('homePage').classList.add('hidden');
            document.getElementById('searchResults').classList.add('hidden');

            // Show iframe
            const frame = document.getElementById('browserFrame');
            frame.classList.remove('hidden');
            
            // Note: Due to CORS restrictions, many sites won't load in iframe
            // This is a demonstration of the UI
            frame.src = url;

            // Update UI
            document.getElementById('urlInput').value = url;
            updateTabTitle(currentTabId, url);
            updateStatus('Loading ' + url);

            // Hide loading after delay
            setTimeout(() => {
                hideLoading();
                updateStatus('Page loaded');
            }, 2000);
        }

        function searchWeb(query) {
            updateStatus('Searching for: ' + query);
            showLoading();

            // Hide other views
            document.getElementById('homePage').classList.add('hidden');
            document.getElementById('browserFrame').classList.add('hidden');

            // Check if API credentials are set
            if (settings.apiKey && settings.searchEngineId) {
                // Use Google Custom Search API
                performGoogleSearch(query);
            } else {
                // Fallback: redirect to Google search
                const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                loadUrl(searchUrl);
            }
        }

        async function performGoogleSearch(query) {
            const apiKey = settings.apiKey;
            const cx = settings.searchEngineId;
            const url = `https://www.googleapis.com/customsearch/v1?key=${apiKey}&cx=${cx}&q=${encodeURIComponent(query)}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                hideLoading();

                if (data.items && data.items.length > 0) {
                    displaySearchResults(data.items, query);
                } else {
                    displayNoResults(query);
                }
            } catch (error) {
                hideLoading();
                console.error('Search error:', error);
                updateStatus('Search failed. Please check your API credentials.');
                
                // Fallback to Google search page
                const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                loadUrl(searchUrl);
            }
        }

        function displaySearchResults(results, query) {
            const container = document.getElementById('searchResults');
            container.innerHTML = `<h2 style="color: #FFE66D; margin-bottom: 20px;">Search results for "${query}"</h2>`;

            results.forEach(result => {
                const resultDiv = document.createElement('div');
                resultDiv.className = 'search-result fade-in';
                resultDiv.onclick = () => loadUrl(result.link);

                resultDiv.innerHTML = `
                    <div class="result-title">${result.htmlTitle || result.title}</div>
                    <div class="result-url">${result.displayLink || result.link}</div>
                    <div class="result-snippet">${result.htmlSnippet || result.snippet}</div>
                `;

                container.appendChild(resultDiv);
            });

            container.classList.remove('hidden');
            updateStatus(`Found ${results.length} results`);
        }

        function displayNoResults(query) {
            const container = document.getElementById('searchResults');
            container.innerHTML = `
                <div style="text-align: center; padding: 60px;">
                    <h2 style="color: #FFE66D; margin-bottom: 20px;">No results found for "${query}"</h2>
                    <p style="color: rgba(255, 255, 255, 0.7);">Try different keywords or check your spelling.</p>
                </div>
            `;
            container.classList.remove('hidden');
            updateStatus('No results found');
        }

        function quickNavigate(url) {
            document.getElementById('urlInput').value = url;
            loadUrl(url);
        }

        // Tab Management
        function createNewTab() {
            tabCounter++;
            const newTabId = tabCounter;

            tabs[newTabId] = {
                url: '',
                title: 'New Tab',
                history: [],
                historyIndex: -1
            };

            const tabsContainer = document.getElementById('tabsContainer');
            const newTabBtn = tabsContainer.querySelector('.new-tab-btn');

            const tabDiv = document.createElement('div');
            tabDiv.className = 'tab fade-in';
            tabDiv.setAttribute('data-tab-id', newTabId);
            tabDiv.onclick = (e) => {
                if (!e.target.classList.contains('tab-close')) {
                    switchTab(newTabId);
                }
            };

            tabDiv.innerHTML = `
                <span class="tab-icon">🏠</span>
                <span class="tab-title">New Tab</span>
                <button class="tab-close" onclick="closeTab(event, ${newTabId})">×</button>
            `;

            tabsContainer.insertBefore(tabDiv, newTabBtn);
            switchTab(newTabId);
        }

        function switchTab(tabId) {
            // Update active tab
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            const tabElement = document.querySelector(`[data-tab-id="${tabId}"]`);
            if (tabElement) {
                tabElement.classList.add('active');
            }

            currentTabId = tabId;
            const tab = tabs[tabId];

            // Update URL bar
            document.getElementById('urlInput').value = tab.url || '';

            // Show appropriate view
            if (!tab.url) {
                showHomePage();
            } else {
                loadUrl(tab.url, false);
            }
        }

        function closeTab(event, tabId) {
            event.stopPropagation();

            const tabElements = document.querySelectorAll('.tab');
            if (tabElements.length <= 1) {
                alert('Cannot close the last tab');
                return;
            }

            // Remove tab element
            const tabElement = document.querySelector(`[data-tab-id="${tabId}"]`);
            if (tabElement) {
                tabElement.remove();
            }

            // Remove from tabs object
            delete tabs[tabId];

            // Switch to another tab if current tab is closed
            if (currentTabId === tabId) {
                const remainingTabs = Object.keys(tabs);
                if (remainingTabs.length > 0) {
                    switchTab(parseInt(remainingTabs[0]));
                }
            }
        }

        function updateTabTitle(tabId, url) {
            const tab = tabs[tabId];
            const domain = new URL(url).hostname;
            tab.title = domain;

            const tabElement = document.querySelector(`[data-tab-id="${tabId}"] .tab-title`);
            if (tabElement) {
                tabElement.textContent = domain;
            }
        }

        // Sidebar Functions
        function toggleBookmarks() {
            showSidebar('Bookmarks', renderBookmarks());
        }

        function toggleHistory() {
            showSidebar('History', renderHistory());
        }

        function toggleDownloads() {
            showSidebar('Downloads', renderDownloads());
        }

        function toggleSettings() {
            showSidebar('Settings', renderSettings());
        }

        function showSidebar(title, content) {
            document.getElementById('sidebarTitle').textContent = title;
            document.getElementById('sidebarContent').innerHTML = content;
            document.getElementById('sidebar').classList.add('active');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('active');
        }

        function renderBookmarks() {
            if (bookmarks.length === 0) {
                return '<p style="color: rgba(255, 255, 255, 0.5); text-align: center; padding: 20px;">No bookmarks yet</p>';
            }

            let html = '<div class="sidebar-section">';
            bookmarks.forEach((bookmark, index) => {
                html += `
                    <div class="sidebar-item" onclick="loadUrl('${bookmark.url}'); closeSidebar();">
                        <span>🔖</span>
                        <div style="flex: 1;">
                            <div style="font-weight: 600;">${bookmark.title}</div>
                            <div style="font-size: 11px; color: rgba(255, 255, 255, 0.5);">${bookmark.url}</div>
                        </div>
                        <button onclick="event.stopPropagation(); removeBookmark(${index})" style="background: rgba(255, 107, 107, 0.3); border: none; padding: 5px 10px; border-radius: 5px; color: white; cursor: pointer;">×</button>
                    </div>
                `;
            });
            html += '</div>';

            html += `<button onclick="addCurrentPageToBookmarks()" style="width: 100%; padding: 12px; background: linear-gradient(135deg, #FFE66D 0%, #FF6B6B 100%); border: none; border-radius: 10px; color: white; font-weight: 600; cursor: pointer; margin-top: 10px;">Add Current Page</button>`;

            return html;
        }

        function renderHistory() {
            if (history.length === 0) {
                return '<p style="color: rgba(255, 255, 255, 0.5); text-align: center; padding: 20px;">No history yet</p>';
            }

            let html = '<div class="sidebar-section">';
            const recentHistory = history.slice(-20).reverse();
            
            recentHistory.forEach((item, index) => {
                html += `
                    <div class="sidebar-item" onclick="loadUrl('${item.url}'); closeSidebar();">
                        <span>🌐</span>
                        <div style="flex: 1;">
                            <div style="font-weight: 600;">${item.title}</div>
                            <div style="font-size: 11px; color: rgba(255, 255, 255, 0.5);">${new Date(item.timestamp).toLocaleString()}</div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';

            html += `<button onclick="clearHistory()" style="width: 100%; padding: 12px; background: rgba(255, 107, 107, 0.5); border: none; border-radius: 10px; color: white; font-weight: 600; cursor: pointer; margin-top: 10px;">Clear History</button>`;

            return html;
        }

        function renderDownloads() {
            return `
                <div style="text-align: center; padding: 40px;">
                    <div style="font-size: 48px; margin-bottom: 20px;">⬇️</div>
                    <p style="color: rgba(255, 255, 255, 0.7);">Downloads feature coming soon!</p>
                    <p style="color: rgba(255, 255, 255, 0.5); font-size: 12px; margin-top: 10px;">This is a frontend demonstration.</p>
                </div>
            `;
        }

        function renderSettings() {
            return `
                <div class="settings-panel">
                    <div class="setting-group">
                        <label class="setting-label">Google API Key</label>
                        <input type="text" class="setting-input" id="apiKeyInput" value="${settings.apiKey}" placeholder="Enter your Google API key">
                        <p style="font-size: 11px; color: rgba(255, 255, 255, 0.5); margin-top: 5px;">Get your API key from Google Cloud Console</p>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">Search Engine ID</label>
                        <input type="text" class="setting-input" id="searchEngineIdInput" value="${settings.searchEngineId}" placeholder="Enter your Search Engine ID (cx)">
                        <p style="font-size: 11px; color: rgba(255, 255, 255, 0.5); margin-top: 5px;">Get this from Programmable Search Engine Control Panel</p>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">Homepage</label>
                        <input type="text" class="setting-input" id="homepageInput" value="${settings.homepage}" placeholder="about:home">
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">Search Engine</label>
                        <select class="setting-input" id="searchEngineSelect">
                            <option value="google" ${settings.searchEngine === 'google' ? 'selected' : ''}>Google</option>
                            <option value="bing" ${settings.searchEngine === 'bing' ? 'selected' : ''}>Bing</option>
                            <option value="duckduckgo" ${settings.searchEngine === 'duckduckgo' ? 'selected' : ''}>DuckDuckGo</option>
                        </select>
                    </div>

                    <button onclick="saveSettings()" style="width: 100%; padding: 15px; background: linear-gradient(135deg, #FFE66D 0%, #FF6B6B 100%); border: none; border-radius: 10px; color: white; font-weight: 600; cursor: pointer; font-size: 16px; margin-top: 20px;">Save Settings</button>

                    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255, 230, 109, 0.2);">
                        <h3 style="color: #FFE66D; margin-bottom: 15px;">About Reitz Browser</h3>
                        <p style="color: rgba(255, 255, 255, 0.7); font-size: 13px; line-height: 1.6;">
                            Reitz is a futuristic browser frontend with sleek design and modern animations. 
                            This is a demonstration of UI/UX capabilities.
                        </p>
                        <p style="color: rgba(255, 255, 255, 0.5); font-size: 12px; margin-top: 10px;">Version 1.0.0</p>
                    </div>
                </div>
            `;
        }

        // Settings Functions
        function loadSettings() {
            // Settings are already loaded in the settings variable
        }

        function saveSettings() {
            settings.apiKey = document.getElementById('apiKeyInput').value;
            settings.searchEngineId = document.getElementById('searchEngineIdInput').value;
            settings.homepage = document.getElementById('homepageInput').value;
            settings.searchEngine = document.getElementById('searchEngineSelect').value;

            localStorage.setItem('reitz_settings', JSON.stringify(settings));
            
            updateStatus('Settings saved successfully');
            setTimeout(() => {
                closeSidebar();
            }, 1000);
        }

        // Bookmark Functions
        function addCurrentPageToBookmarks() {
            const tab = tabs[currentTabId];
            if (!tab.url) {
                alert('No page to bookmark');
                return;
            }

            const bookmark = {
                title: tab.title,
                url: tab.url,
                timestamp: Date.now()
            };

            bookmarks.push(bookmark);
            localStorage.setItem('reitz_bookmarks', JSON.stringify(bookmarks));
            
            updateStatus('Bookmark added');
            showSidebar('Bookmarks', renderBookmarks());
        }

        function removeBookmark(index) {
            bookmarks.splice(index, 1);
            localStorage.setItem('reitz_bookmarks', JSON.stringify(bookmarks));
            showSidebar('Bookmarks', renderBookmarks());
        }

        // History Functions
        function addToGlobalHistory(url) {
            const historyItem = {
                title: new URL(url).hostname,
                url: url,
                timestamp: Date.now()
            };

            history.push(historyItem);
            
            // Keep only last 100 items
            if (history.length > 100) {
                history = history.slice(-100);
            }

            localStorage.setItem('reitz_history', JSON.stringify(history));
        }

        function clearHistory() {
            if (confirm('Are you sure you want to clear all history?')) {
                history = [];
                localStorage.setItem('reitz_history', JSON.stringify(history));
                showSidebar('History', renderHistory());
                updateStatus('History cleared');
            }
        }

        // UI Helper Functions
        function showHomePage() {
            document.getElementById('homePage').classList.remove('hidden');
            document.getElementById('browserFrame').classList.add('hidden');
            document.getElementById('searchResults').classList.add('hidden');
            document.getElementById('urlInput').value = '';
            updateStatus('Ready');
        }

        function showLoading() {
            const loadingBar = document.getElementById('loadingBar');
            loadingBar.classList.add('active');
        }

        function hideLoading() {
            const loadingBar = document.getElementById('loadingBar');
            loadingBar.classList.remove('active');
        }

        function updateStatus(message) {
            document.getElementById('statusText').textContent = message;
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', function(e) {
            // Ctrl/Cmd + T: New Tab
            if ((e.ctrlKey || e.metaKey) && e.key === 't') {
                e.preventDefault();
                createNewTab();
            }

            // Ctrl/Cmd + W: Close Tab
            if ((e.ctrlKey || e.metaKey) && e.key === 'w') {
                e.preventDefault();
                const tabElements = document.querySelectorAll('.tab');
                if (tabElements.length > 1) {
                    closeTab(e, currentTabId);
                }
            }

            // Ctrl/Cmd + R: Refresh
            if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
                e.preventDefault();
                refresh();
            }

            // Ctrl/Cmd + L: Focus address bar
            if ((e.ctrlKey || e.metaKey) && e.key === 'l') {
                e.preventDefault();
                document.getElementById('urlInput').focus();
                document.getElementById('urlInput').select();
            }

            // Ctrl/Cmd + D: Add bookmark
            if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
                e.preventDefault();
                addCurrentPageToBookmarks();
            }
        });

        // Update connection status
        window.addEventListener('online', () => {
            document.getElementById('connectionStatus').textContent = '🌐 Online';
        });

        window.addEventListener('offline', () => {
            document.getElementById('connectionStatus').textContent = '📡 Offline';
        });
    </script>
</body>
</html>
